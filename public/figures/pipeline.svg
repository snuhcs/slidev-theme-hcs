<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" font-family="Noto Sans, Helvetica Neue, Arial, sans-serif">
  <rect width="480" height="270" fill="#ffffff"/>

  <defs>
    <marker id="pipeline-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#7077a1"/>
    </marker>
    <marker id="pipeline-arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#d46a26"/>
    </marker>
  </defs>

  <g font-size="14" text-anchor="middle">
    <rect x="24" y="86" width="112" height="66" rx="6" fill="#f4f5f9" stroke="#7077a1" stroke-width="1.6"/>
    <text x="80" y="113" fill="#2d3250" font-weight="700">Workload</text>
    <text x="80" y="132" fill="#656565" font-size="12">operator graph</text>

    <rect x="184" y="86" width="112" height="66" rx="6" fill="#2d3250"/>
    <text x="240" y="113" fill="#ffffff" font-weight="700">Generator</text>
    <text x="240" y="132" fill="#c9ccdd" font-size="12">schedule search</text>

    <rect x="344" y="86" width="112" height="66" rx="6" fill="#f4f5f9" stroke="#7077a1" stroke-width="1.6"/>
    <text x="400" y="113" fill="#2d3250" font-weight="700">Target</text>
    <text x="400" y="132" fill="#656565" font-size="12">measured latency</text>
  </g>

  <g stroke="#7077a1" stroke-width="2" marker-end="url(#pipeline-arrow)">
    <line x1="136" y1="119" x2="178" y2="119"/>
    <line x1="296" y1="119" x2="338" y2="119"/>
  </g>

  <path d="M400 152 L400 196 L240 196 L240 158" fill="none" stroke="#d46a26" stroke-width="2"
    stroke-dasharray="6 4" marker-end="url(#pipeline-arrow-accent)"/>
  <text x="320" y="212" fill="#d46a26" font-size="12" text-anchor="middle">feedback: measured cost</text>

  <rect x="184" y="30" width="112" height="34" rx="6" fill="#ffffff" stroke="#f6b17a" stroke-width="1.6"/>
  <text x="240" y="52" fill="#8a5a2b" font-size="12.5" text-anchor="middle">hardware prior</text>
  <line x1="240" y1="64" x2="240" y2="80" stroke="#f6b17a" stroke-width="2" marker-end="url(#pipeline-arrow)"/>
</svg>
